<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>WaveLock Console</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard" aria-label="WaveLock home">
        <img class="brand-mark" src="assets/logo.svg" alt="">
        <span class="brand-text">
          <span class="brand-name">WaveLock</span>
          <span class="brand-sub">Multimodal biometric sign-in</span>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="mode-badge"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <span class="pill" id="camera-pill" role="status" aria-live="polite"></span>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light or dark mode"></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
</body>
</html>
